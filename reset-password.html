
<script type="module">

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";

// ========================================
// ALAF V2.6 - SUPABASE CONFIGURATION
// ========================================

const SUPABASE_URL =
  "https://wztldbfhpfdhalurgfcb.supabase.co";

// GANTIKAN dengan Publishable Key sebenar.
// Jangan gunakan service_role atau secret key.
const SUPABASE_KEY =
  "sb_publishable_G1T1VoU7o5Zl1AKMtB7i5Q_Z866SaCl";

// ========================================
// ELEMENT HALAMAN
// ========================================

const statusEl =
  document.getElementById("status");

const form =
  document.getElementById("resetForm");

const resetBtn =
  document.getElementById("resetBtn");

const passwordInput =
  document.getElementById("password");

const confirmInput =
  document.getElementById("confirmPassword");

let recoveryVerified = false;
let recoveryFinished = false;

function showStatus(message, isError = false) {
  statusEl.textContent = message;
  statusEl.className =
    isError ? "error" : "success";
}

function allowPasswordReset() {
  if (recoveryFinished) return;

  recoveryVerified = true;
  form.hidden = false;

  showStatus(
    "Pautan pemulihan disahkan. " +
    "Sila masukkan kata laluan baharu."
  );
}

function rejectRecovery(message) {
  recoveryVerified = false;
  form.hidden = true;
  showStatus(message, true);
}

// ========================================
// SEMAK KONFIGURASI
// ========================================

if (
  !SUPABASE_KEY ||
  SUPABASE_KEY ===
    "sb_publishable_G1T1VoU7o5Zl1AKMtB7i5Q_Z866SaCl"
) {

  rejectRecovery(
    "Publishable Key belum ditetapkan."
  );

} else {

  // ======================================
  // SAMBUNGAN SUPABASE
  // ======================================

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: false,
        autoRefreshToken: false,
        detectSessionInUrl: false
      }
    }
  );

  // ======================================
  // BACA PARAMETER PAUTAN
  // ======================================

  const query = new URLSearchParams(
    window.location.search
  );

  const hash = new URLSearchParams(
    window.location.hash.substring(1)
  );

  const tokenHash =
    query.get("token_hash");

  const queryType =
    query.get("type");

  const accessToken =
    hash.get("access_token");

  const refreshToken =
    hash.get("refresh_token");

  const hashType =
    hash.get("type");

  const authCode =
    query.get("code");

  // ======================================
  // BERSIHKAN URL
  // ======================================

  function clearRecoveryUrl() {
    window.history.replaceState(
      null,
      "",
      window.location.pathname
    );
  }

  // ======================================
  // PENGESAHAN PAUTAN PEMULIHAN
  // ======================================

  async function checkRecovery() {

    // Kaedah 1:
    // Supabase token_hash + type=recovery
    if (
      tokenHash &&
      queryType === "recovery"
    ) {

      const { data, error } =
        await supabase.auth.verifyOtp({
          token_hash: tokenHash,
          type: "recovery"
        });

      if (error || !data.session) {
        rejectRecovery(
          "Pautan pemulihan tidak sah " +
          "atau telah tamat tempoh."
        );
        return;
      }

      clearRecoveryUrl();
      allowPasswordReset();
      return;
    }

    // Kaedah 2:
    // Pautan recovery menggunakan
    // access_token dan refresh_token
    if (
      hashType === "recovery" &&
      accessToken &&
      refreshToken
    ) {

      const { data, error } =
        await supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

      if (error || !data.session) {
        rejectRecovery(
          "Pautan pemulihan tidak sah " +
          "atau telah tamat tempoh."
        );
        return;
      }

      clearRecoveryUrl();
      allowPasswordReset();
      return;
    }

    // Kaedah 3:
    // Pautan PKCE dengan kod sahaja
    // tidak membuktikan bahawa pautan
    // tersebut khusus untuk recovery.
    if (authCode) {
      rejectRecovery(
        "Pautan menggunakan format " +
        "pengesahan yang belum disokong. " +
        "Sila gunakan pautan pemulihan " +
        "yang disediakan untuk ALAF."
      );
      return;
    }

    rejectRecovery(
      "Tiada pautan pemulihan dikesan. " +
      "Sila minta e-mel reset baharu."
    );
  }

  // ======================================
  // JALANKAN PENGESAHAN
  // ======================================

  checkRecovery().catch(() => {
    rejectRecovery(
      "Gagal mengesahkan pautan pemulihan. " +
      "Sila cuba pautan baharu."
    );
  });

  // ======================================
  // SIMPAN KATA LALUAN BAHARU
  // ======================================

  form.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      if (
        !recoveryVerified ||
        recoveryFinished
      ) {
        return;
      }

      const password =
        passwordInput.value;

      const confirmPassword =
        confirmInput.value;

      if (password.length < 12) {
        showStatus(
          "Kata laluan mesti mempunyai " +
          "sekurang-kurangnya 12 aksara.",
          true
        );
        return;
      }

      if (password !== confirmPassword) {
        showStatus(
          "Kedua-dua kata laluan " +
          "tidak sepadan.",
          true
        );
        return;
      }

      resetBtn.disabled = true;

      showStatus(
        "Sedang menyimpan kata laluan..."
      );

      try {

        const { error } =
          await supabase.auth.updateUser({
            password: password
          });

        if (error) {
          throw error;
        }

        recoveryFinished = true;
        recoveryVerified = false;

        form.hidden = true;

        passwordInput.value = "";
        confirmInput.value = "";

        clearRecoveryUrl();

        showStatus(
          "Kata laluan baharu berjaya " +
          "disimpan! Sila kembali " +
          "ke halaman log masuk ALAF."
        );

        await supabase.auth.signOut({
          scope: "local"
        });

      } catch (error) {

        showStatus(
          "Gagal menyimpan kata laluan. " +
          "Sila semak syarat kata laluan " +
          "atau minta pautan baharu.",
          true
        );

        resetBtn.disabled = false;
      }
    }
  );
}

</script>
