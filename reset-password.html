
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>ALAF V2.6 - Reset Password</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(
    135deg, #ffe0ed, #fff6fa
  );
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.box {
  width: 100%;
  max-width: 430px;
  background: white;
  padding: 32px;
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 10px 35px #d6338426;
}

.logo {
  color: #e91e77;
  font-size: 44px;
  font-weight: 900;
}

.subtitle {
  color: #a31256;
}

h2 {
  color: #333;
  margin-top: 30px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: #e91e77;
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#status {
  margin-top: 18px;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.success {
  color: #147d45;
}

.error {
  color: #c62828;
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">ALAF</div>

  <p class="subtitle">
    A Line For Life
  </p>

  <h2>Reset Kata Laluan</h2>

  <p>
    Tetapkan kata laluan baharu
    untuk akaun Pentadbir ALAF.
  </p>

  <form id="resetForm" hidden>

    <input
      id="password"
      type="password"
      placeholder="Kata laluan baharu"
      autocomplete="new-password"
      minlength="12"
      required
    >

    <input
      id="confirmPassword"
      type="password"
      placeholder="Sahkan kata laluan baharu"
      autocomplete="new-password"
      minlength="12"
      required
    >

    <button id="resetBtn" type="submit">
      SIMPAN KATA LALUAN
    </button>

  </form>

  <div id="status" role="status"
       aria-live="polite">
    Sedang mengesahkan pautan pemulihan...
  </div>

  <p style="font-size:12px;color:#888">
    ALAF V2.6 | Pemulihan Akaun Pentadbir
  </p>

</div>

<script type="module">

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL =
  "https://wztldbfhpfdhalurgfcb.supabase.co";

// Gantikan dengan Publishable Key awak.
// JANGAN gunakan service_role / secret key.
const SUPABASE_KEY =
  "sb_publishable_G1T1VoU7o5Zl1AKMtB7i5Q_Z866SaCl";

const statusEl =
  document.getElementById("status");

const form =
  document.getElementById("resetForm");

const resetBtn =
  document.getElementById("resetBtn");

let recoveryVerified = false;

function showStatus(message, error = false) {
  statusEl.textContent = message;
  statusEl.className =
    error ? "error" : "success";
}

if (
  SUPABASE_KEY ===
  "sb_publishable_G1T1VoU7o5Zl1AKMtB7i5Q_Z866SaCl"
) {

  showStatus(
    "Publishable Key belum ditetapkan.",
    true
  );

} else {

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: false,
        autoRefreshToken: false,
        detectSessionInUrl: true
      }
    }
  );

  async function checkRecovery() {

    const params =
      new URLSearchParams(window.location.search);

    const code = params.get("code");

    // Supabase PKCE recovery
    if (code) {

      const { error } =
        await supabase.auth.exchangeCodeForSession(
          code
        );

      if (error) {
        showStatus(
          "Pautan pemulihan tidak sah " +
          "atau telah tamat tempoh.",
          true
        );
        return;
      }

    }

    const {
      data: { session }
    } = await supabase.auth.getSession();

    if (!session) {

      showStatus(
        "Tiada sesi pemulihan yang sah. " +
        "Sila minta pautan reset baharu.",
        true
      );

      return;
    }

    // Sesi biasa sahaja tidak mencukupi.
    // Halaman ini mesti dibuka melalui
    // pautan pemulihan kata laluan.
    const hashParams =
      new URLSearchParams(
        window.location.hash.substring(1)
      );

    const isRecoveryLink =
      hashParams.get("type") === "recovery";

    if (!code && !isRecoveryLink) {

      showStatus(
        "Halaman ini memerlukan " +
        "pautan pemulihan kata laluan.",
        true
      );

      return;
    }

    recoveryVerified = true;
    form.hidden = false;

    showStatus(
      "Pautan disahkan. " +
      "Sila masukkan kata laluan baharu."
    );
  }

  checkRecovery().catch(() => {
    showStatus(
      "Gagal mengesahkan pautan pemulihan.",
      true
    );
  });

  form.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      if (!recoveryVerified) {
        return;
      }

      const password =
        document.getElementById(
          "password"
        ).value;

      const confirmPassword =
        document.getElementById(
          "confirmPassword"
        ).value;

      if (password !== confirmPassword) {

        showStatus(
          "Kata laluan tidak sepadan.",
          true
        );

        return;
      }

      if (password.length < 12) {

        showStatus(
          "Gunakan sekurang-kurangnya " +
          "12 aksara.",
          true
        );

        return;
      }

      resetBtn.disabled = true;

      const { error } =
        await supabase.auth.updateUser({
          password
        });

      if (error) {

        showStatus(
          "Gagal menetapkan kata laluan. " +
          "Sila cuba pautan pemulihan baharu.",
          true
        );

        resetBtn.disabled = false;
        return;
      }

      await supabase.auth.signOut({
        scope: "local"
      });

      form.hidden = true;

      showStatus(
        "Kata laluan berjaya ditetapkan! " +
        "Sila kembali ke halaman log masuk."
      );

      history.replaceState(
        null,
        "",
        window.location.pathname
      );
    }
  );
}
</script>

</body>
</html>
