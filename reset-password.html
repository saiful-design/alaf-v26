<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Reset Kata Laluan | ALAF V2.6</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 22px; background: linear-gradient(135deg,#fff1f7,#f9c5db); color: #50243a; }
    main { width: 100%; max-width: 440px; background: #fff; padding: 32px 28px; border-radius: 22px; box-shadow: 0 16px 45px #8e35542e; }
    .brand { text-align: center; font-size: 42px; font-weight: 900; letter-spacing: 3px; color: #ce3475; }
    .tagline { text-align: center; color: #93516e; margin: 4px 0 24px; font-size: 14px; }
    h1 { font-size: 23px; text-align: center; margin: 0 0 10px; }
    .intro { text-align: center; line-height: 1.5; color: #755668; font-size: 14px; margin-bottom: 22px; }
    label { display: block; font-weight: 700; margin: 15px 0 7px; font-size: 14px; }
    input { width: 100%; border: 1px solid #d8b9c7; border-radius: 11px; padding: 13px; font-size: 16px; }
    input:focus { outline: 2px solid #e67daa; outline-offset: 1px; }
    button { width: 100%; background: #cf3477; border: 0; border-radius: 11px; color: white; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 22px; }
    button:disabled { opacity: .65; cursor: wait; }
    #status { font-size: 14px; line-height: 1.55; padding: 13px; border-radius: 10px; margin: 0 0 16px; background: #fff0f6; }
    #status.error { color: #8d1e36; background: #ffe5e9; }
    #status.success { color: #17603b; background: #e7f7ec; }
    .note { margin-top: 18px; font-size: 12px; color: #826c78; text-align: center; line-height: 1.5; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="brand">ALAF</div>
    <p class="tagline">A Line For Life · V2.6</p>
    <h1>Reset Kata Laluan</h1>
    <p class="intro">Halaman pemulihan kata laluan Pentadbir ALAF.</p>
    <p id="status" role="status" aria-live="polite">Sedang memeriksa pautan pemulihan...</p>
    <form id="resetForm" hidden>
      <label for="password">Kata laluan baharu</label>
      <input id="password" type="password" autocomplete="new-password" minlength="12" required />
      <label for="confirmPassword">Sahkan kata laluan baharu</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required />
      <button id="resetBtn" type="submit">Simpan Kata Laluan Baharu</button>
    </form>
    <p class="note">Untuk keselamatan, jangan kongsi pautan pemulihan atau kata laluan dengan sesiapa.</p>
  </main>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://wztldbfhpfdhalurgfcb.supabase.co';
    // GANTIKAN nilai di bawah dengan Publishable Key (sb_publishable_...) projek Supabase awak.
    // Jangan gunakan service_role atau secret key.
    const SUPABASE_KEY = 'sb_publishable_G1T1VoU7o5Zl1AKMtB7i5Q_Z866SaCl';

    const statusEl = document.getElementById('status');
    const form = document.getElementById('resetForm');
    const resetBtn = document.getElementById('resetBtn');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    let recoveryVerified = false;
    let recoveryFinished = false;

    function showStatus(message, error = false) {
      statusEl.textContent = message;
      statusEl.className = error ? 'error' : 'success';
    }
    function rejectRecovery(message) {
      recoveryVerified = false;
      form.hidden = true;
      showStatus(message, true);
    }
    function allowPasswordReset() {
      if (recoveryFinished) return;
      recoveryVerified = true;
      form.hidden = false;
      showStatus('Pautan pemulihan disahkan. Sila tetapkan kata laluan baharu.');
    }
    function clearRecoveryUrl() {
      window.history.replaceState(null, '', window.location.pathname);
    }

    if (!SUPABASE_KEY || SUPABASE_KEY === 'TAMPAL_PUBLISHABLE_KEY_DI_SINI') {
      rejectRecovery('Konfigurasi ALAF belum lengkap: Publishable Key belum dimasukkan.');
    } else {
      const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
      });
      const query = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const errorCode = hash.get('error_code') || query.get('error_code');
      const accessToken = hash.get('access_token');
      const refreshToken = hash.get('refresh_token');
      const tokenHash = query.get('token_hash');
      const type = query.get('type') || hash.get('type');

      async function checkRecovery() {
        if (errorCode) {
          clearRecoveryUrl();
          rejectRecovery(errorCode === 'otp_expired'
            ? 'Pautan pemulihan tidak sah atau telah tamat tempoh. Sila minta e-mel baharu.'
            : 'Pautan pemulihan ditolak. Sila minta e-mel baharu.');
          return;
        }
        if (type === 'recovery' && tokenHash) {
          const { data, error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
          clearRecoveryUrl();
          if (error || !data.session) { rejectRecovery('Pautan pemulihan tidak sah atau telah tamat tempoh.'); return; }
          allowPasswordReset();
          return;
        }
        if (type === 'recovery' && accessToken && refreshToken) {
          const { data, error } = await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
          clearRecoveryUrl();
          if (error || !data.session) { rejectRecovery('Pautan pemulihan tidak sah atau telah tamat tempoh.'); return; }
          allowPasswordReset();
          return;
        }
        if (query.has('code')) {
          clearRecoveryUrl();
          rejectRecovery('Pautan menggunakan format pengesahan yang belum disokong oleh halaman ini.');
          return;
        }
        rejectRecovery('Tiada pautan pemulihan dikesan. Sila buka pautan daripada e-mel pemulihan baharu.');
      }
      checkRecovery().catch(() => {
        clearRecoveryUrl();
        rejectRecovery('Gagal mengesahkan pautan. Sila cuba pautan pemulihan baharu.');
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!recoveryVerified || recoveryFinished) return;
        const password = passwordInput.value;
        if (password.length < 12) { showStatus('Gunakan sekurang-kurangnya 12 aksara.', true); return; }
        if (password !== confirmInput.value) { showStatus('Kedua-dua kata laluan tidak sepadan.', true); return; }
        resetBtn.disabled = true;
        showStatus('Sedang menyimpan kata laluan...');
        try {
          const { error } = await supabase.auth.updateUser({ password });
          if (error) throw error;
          recoveryFinished = true;
          recoveryVerified = false;
          form.hidden = true;
          passwordInput.value = '';
          confirmInput.value = '';
          clearRecoveryUrl();
          showStatus('Kata laluan baharu berjaya disimpan. Sila kembali ke halaman log masuk ALAF.');
          await supabase.auth.signOut({ scope: 'local' });
        } catch (_) {
          if (!recoveryFinished) {
            showStatus('Gagal menyimpan kata laluan. Sila cuba lagi atau minta pautan pemulihan baharu.', true);
            resetBtn.disabled = false;
          }
        }
      });
    }
  </script>
</body>
</html>
